name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint · Test · Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only for now. The Windows adapter is implemented but has never
        # been verified on real Windows hardware, and one path-separator test
        # (CodexSessionWatcher > dateDirCandidates) fails there. Re-enable the
        # windows-latest leg once the adapter is validated on a real machine —
        # see Roadmap. A permanently red CI is worse than a scoped one.
        os: [macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build (compile, no installer)
        run: pnpm build
        env:
          # Prevent electron-builder from attempting code-signing in CI
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
